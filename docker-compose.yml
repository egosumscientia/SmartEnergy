services:
  db:
    image: postgres:16-alpine
    container_name: smartenergy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartenergy
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartuser -d smartenergy"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartenergy-init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smartuser:smartpwd@db:5432/smartenergy
      PYTHONPATH: /app
    command: >
      sh -lc "
      python -m smartenergy.operations.wait_for_db &&
      python -m smartenergy.operations.seed_db &&
      python -m smartenergy.operations.simulate_data &&
      python -m smartenergy.operations.train_model &&
      python -m smartenergy.operations.detect_anomalies
      "
    volumes:
      - models_data:/app/models

  realtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartenergy-realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://smartuser:smartpwd@db:5432/smartenergy
      PYTHONPATH: /app
    command: >
      sh -lc "
      python -m smartenergy.operations.wait_for_db &&
      python -m smartenergy.operations.stream_realtime --interval 1 --batch-size 5 --anomaly-ratio 0.12 --max-registros 20000
      "

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartenergy-trainer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://smartuser:smartpwd@db:5432/smartenergy
      PYTHONPATH: /app
    command: >
      sh -lc "
      python -m smartenergy.operations.wait_for_db &&
      python -m smartenergy.operations.auto_train_loop --interval 300
      "
    volumes:
      - models_data:/app/models

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartenergy-dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${SMARTENERGY_MONITOR_DATABASE_URL:?Configura la URL del rol SQL de consulta}
      PYTHONPATH: /app
      PGOPTIONS: -c default_transaction_read_only=on
    command: >
      sh -lc "
      python -m smartenergy.operations.wait_for_db &&
      uvicorn smartenergy.interfaces.api.main:app --host 0.0.0.0 --port 8501
      "
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - models_data:/app/models:ro

volumes:
  postgres_data:
  models_data:
